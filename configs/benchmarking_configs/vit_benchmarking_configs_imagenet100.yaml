batch_size: 512
train_batch_size: 512    # actual training batch size (used to scale FLOPs correctly)
image_size: 224
num_classes: 100
batches_per_epoch: 254   # 130000 training images / 512 batch_size
device: cuda:0
dtype: bfloat16
n_iters: 3

# VisionTransformer model parameters (ViT-Base / DeiT-Base)
patch_size: 16
in_chans: 3
embed_dim: 768
depth: 12
num_heads: 12
mlp_ratio: 4.0
qkv_bias: true
drop_rate: 0.0
attn_drop_rate: 0.0
drop_path_rate: 0.1
