# ViT-B/16 on ImageNet-100 — LDFA, uniform rank 32
dataset: imagenet100
data_dir: ~/data/imagenet
class_list_file: ./data/imagenet100_classes.txt
num_classes: 100
image_size:  224

# Model (ViT-Base)
model_name:     vit_b_16_deit
patch_size:     16
in_chans:       3
embed_dim:      768
depth:          12
num_heads:      12
mlp_ratio:      4.0
qkv_bias:       true
drop_rate:      0.0
attn_drop_rate: 0.0
drop_path_rate: 0.0

# Training (single A100)
batch_size:    512
num_epochs:    300
warmup_epochs: 5

# Optimizer (forward weights)
learning_rate: 5e-4     # DeiT base lr at batch 512
weight_decay:  0.05
no_wd_bias_norm: true
eta_min:       1e-5

# Regularization / Augmentation
mixup_alpha:     0.8
cutmix_alpha:    1.0
label_smoothing: 0.1
# RandAugment and RandomErasing are in the dataloader (num_ops=2, mag=9, erasing_p=0.25)

# LDFA feedback optimizer (Q, P): AdamW, same 5-epoch linear warmup + cosine schedule as the forward optimizer
use_ldfa_linear: true
ldfa_rank:       32
qp_lr:           2.5e-3
qp_weight_decay: 0.05
qp_eta_min:      1e-3

# EMA disabled (not part of the reported recipe)
use_ema:       false

# Misc
compile: true
grad_clip: 1.0
log_name:       LDFA_32_imagenet100_exp1
