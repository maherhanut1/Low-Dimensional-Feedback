# ViT-B/16 on full ImageNet-1K — BP (standard backprop)
dataset:    imagenet
imagenet_dir: ~/data/imagenet
num_classes: 1000
image_size:  224

# Model (ViT-Base)
model_name:     vit_b_16
patch_size:     16
in_chans:       3
embed_dim:      768
depth:          12
num_heads:      12
mlp_ratio:      4.0
qkv_bias:       true
drop_rate:      0.0
attn_drop_rate: 0.0
drop_path_rate: 0.0

# Training
batch_size:    512       # per-GPU batch; 2 GPUs × 512 = 1024 effective
num_epochs:    300
warmup_epochs: 5

# Multi-GPU (2 × A100, DDP)
gpu_ids: [0, 1]
master_port: 12355

# Optimizer (forward weights)
learning_rate: 1e-3     # DeiT scaling: 5e-4 × 1024 / 512
weight_decay:  0.05
no_wd_bias_norm: true
eta_min:       1e-5

# Regularization / Augmentation
mixup_alpha:     0.8
cutmix_alpha:    1.0
label_smoothing: 0.1
# RandAugment and RandomErasing are in the dataloader (num_ops=2, mag=9, erasing_p=0.25)

# LDFA
use_ldfa_linear: false

# EMA disabled (not part of the reported recipe)
use_ema:       false

# Misc
compile: true
num_workers: 16         # split evenly across the GPU processes
log_name:       BP_imagenet1k_exp1
