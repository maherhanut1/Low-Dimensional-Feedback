# ViT-Base on full ImageNet-1K — BP (standard backprop)
# Follows DeiT-Base training recipe

dataset:    imagenet
imagenet_dir: ~/data/imagenet
num_classes: 1000
image_size:  224

# Model (ViT-Base)
model_name:     vit_b_16
patch_size:     16
in_chans:       3
embed_dim:      768
depth:          12
num_heads:      12
mlp_ratio:      4.0
qkv_bias:       true
drop_rate:      0.0
attn_drop_rate: 0.0
drop_path_rate: 0.1

# Training
batch_size:    1024       # per-GPU batch; 2 GPUs × 512 = 1024 effective (matches single-GPU BS=1024)
num_epochs:    300
warmup_epochs: 5

# Multi-GPU
gpu_ids: [5, ]          # run on GPU 0 and GPU 1
master_port: 12355 #12355        # different port from the other job running on GPUs 2,3 (which uses 12355)

# Optimizer
learning_rate: 1e-3     # DeiT: lr = base_lr * batch_size / 512 = 5e-4 * 128/512 * ... 
                        # standard is 1e-3 at batch 1024; scale accordingly
weight_decay:  0.05
no_wd_bias_norm: true
eta_min:       1e-5

# Regularization / Augmentation
mixup_alpha:     0.8
cutmix_alpha:    1.0
label_smoothing: 0.1
# RandAugment and RandomErasing are in the dataloader (num_ops=2, mag=9, erasing_p=0.25)

# LDFA
# LDFA
use_ldfa_linear: true
# ldfa_rank: 128
qp_lr:           1e-2
qp_weight_decay: 0.05
qp_eta_min:      1e-3

# Per-layer rank map — add this to override per block
# SET 1
# ldfa_layer_ranks:
#   0:  96    # keep as BP (standard backprop)
#   1:  96
#   2:  96
#   3:  96
#   4:  96
#   5:  128
#   6:  128
#   7:  192
#   8:  192
#   9:  -1
#   10: -1
#   11: -1

# #SET 2:
ldfa_layer_ranks:
  0:  64    # keep as BP (standard backprop)
  1:  64
  2:  64
  3:  96
  4:  96
  5:  96
  6:  128
  7:  128
  8:  192
  9:  192
  10: -1
  11: -1

# EMA (Exponential Moving Average of model weights)
# Set use_ema: true to enable; has no effect on previous runs when false
use_ema:       true
ema_decay:     0.99996  # DeiT base decay; effective decay at bs=512 is ~0.99998 (= 1 - (1-0.99996)*(512/1024))

# Misc
compile: true
num_workers: 8         # will be split evenly per GPU process (24 / 2 GPUs = 12 workers each)
log_name:       LDFA_multiR_setting2_imagenet1k_EMA_qp_1e2_qpmin_1e3_1GPUs_node2_exp2
log_dir:        artifacts/training_checkpoints/imagenet/vit_b_16/LDFA_128_imagenet1k/logs
checkpoint_dir: artifacts/training_checkpoints/imagenet/vit_b_16/LDFA_128_imagenet1k
